# Coolify "Docker Compose" build pack — full stack: app + queue worker +
# scheduler + MySQL + Redis. Coolify fills the SERVICE_* magic variables
# (domain + generated passwords). Set APP_KEY, VAPID_* and AWS_* in the Coolify
# Environment Variables screen.

x-app-env: &app-env
  APP_NAME: "Cloudflare Mailbox"
  APP_ENV: production
  APP_DEBUG: "false"
  # Auto-generated & persisted by Coolify (SERVICE_REALBASE64_* = base64 of 32
  # random bytes = a valid Laravel AES-256 key). No need to set APP_KEY yourself.
  APP_KEY: base64:${SERVICE_REALBASE64_APPKEY}
  APP_URL: ${SERVICE_URL_APP}

  LOG_CHANNEL: stderr
  LOG_LEVEL: info

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-mailbox}
  DB_USERNAME: ${MYSQL_USER:-mailbox}
  DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}

  REDIS_HOST: redis
  REDIS_PORT: "6379"

  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis

  # Attachments (Cloudflare R2 / S3 / MinIO)
  CLOUDFLARE_ATTACHMENTS_DISK: ${CLOUDFLARE_ATTACHMENTS_DISK:-s3}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
  AWS_BUCKET: ${AWS_BUCKET}
  AWS_ENDPOINT: ${AWS_ENDPOINT}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # Web Push. Subject auto-defaults to the app URL. The keypair is OPTIONAL:
  # leave empty and the app runs with push disabled; generate once when you want
  # push (php artisan webpush:vapid --show) and set both — they must stay stable.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  # Must be a mailto: or https:// URL (iOS rejects bare values). Defaults to the app URL.
  VAPID_SUBJECT: ${VAPID_SUBJECT:-${SERVICE_URL_APP}}

  CLOUDFLARE_SEND_DRIVER: ${CLOUDFLARE_SEND_DRIVER:-api}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-mailbox:latest
    environment:
      <<: *app-env
      # Tells Coolify to assign this service a public domain on port 8080.
      SERVICE_FQDN_APP_8080: /
      # Boot-time automations (this service only): run migrations, link storage.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # DB-INDEPENDENT health check: Laravel's /up returns 200 without touching
    # MySQL/Redis, so a transient database blip does NOT mark the app unhealthy
    # (which previously cascaded into the container being stopped and then pruned
    # by Coolify's nightly cleanup, taking the whole stack down). Long
    # start_period covers boot + migrations.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Soft reservation — protects this stack from noisy neighbours on a busy host
    # without a hard cap (a hard limit + no swap would risk cgroup-OOM kills).
    mem_reservation: 384m
    restart: unless-stopped

  worker:
    image: cloudflare-mailbox:latest
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600
    environment: *app-env
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: cloudflare-mailbox:latest
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment: *app-env
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    # Cap MySQL's footprint on a shared host: the InnoDB buffer pool is its
    # largest allocation and fewer max connections bounds per-connection RAM.
    command: --innodb-buffer-pool-size=256M --max-connections=60
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mailbox}
      MYSQL_USER: ${MYSQL_USER:-mailbox}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${SERVICE_PASSWORD_MYSQLROOT}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_reservation: 384m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bound Redis' memory so it can't grow unbounded and starve the host; evict
    # least-recently-used keys instead of dying (cache/session/queue tolerate it).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_reservation: 320m
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
