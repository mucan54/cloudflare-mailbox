# Copied into the serversideup image's /etc/nginx/server-opts.d/, which every
# site config includes.
#
# The service worker must never be cached. The image's default asset rule
# (performance.conf) sends every *.js with "public, max-age=31536000,
# immutable", and Cloudflare honours that at the edge — so a browser's SW
# update check (which bypasses only its own HTTP cache) keeps getting the old
# worker for up to a year and a fixed sw.js never reaches clients. An exact
# match beats that regex location. `expires` (not add_header) keeps the
# server-level security headers inherited.
location = /sw.js {
    expires epoch;
    access_log off;
    try_files $uri =404;
}
